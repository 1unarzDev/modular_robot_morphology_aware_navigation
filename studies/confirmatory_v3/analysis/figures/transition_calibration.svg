<circle cx="499.7" cy="156.7" r="8.0" fill="#64748b" opacity="0.8"/>
<text class="tick" x="75" y="402"><tspan fill="#64748b">●</tspan> feasibility</text>
<polyline points="499.8,177.0" fill="none" stroke="#f59e0b" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" width="520" height="444" viewBox="0 0 520 444">
<title>Confirmatory completion and contrasts</title>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:system-ui,sans-serif;fill:#172033}.title{font-size:15px;font-weight:600}.label{font-size:14px}.small{font-size:13px;fill:#64748b}.tick{font-size:12px;fill:#64748b}</style>
<text x="12" y="20" class="title">(a) Mission completion, 720 missions on 60 layouts</text>
<line x1="170.0" y1="26" x2="170.0" y2="138" stroke="#e2e8f0" stroke-width="1"/>
<text x="170.0" y="154" text-anchor="middle" class="tick">0</text>
<line x1="251.5" y1="26" x2="251.5" y2="138" stroke="#e2e8f0" stroke-width="1"/>
<text x="251.5" y="154" text-anchor="middle" class="tick">0.25</text>
<line x1="333.0" y1="26" x2="333.0" y2="138" stroke="#e2e8f0" stroke-width="1"/>
<text x="333.0" y="154" text-anchor="middle" class="tick">0.5</text>
<line x1="414.5" y1="26" x2="414.5" y2="138" stroke="#e2e8f0" stroke-width="1"/>
<text x="414.5" y="154" text-anchor="middle" class="tick">0.75</text>
<line x1="496.0" y1="26" x2="496.0" y2="138" stroke="#e2e8f0" stroke-width="1"/>
<text x="496.0" y="154" text-anchor="middle" class="tick">1</text>
<text x="160" y="46" text-anchor="end" class="label">route first</text>
<line x1="175.4" y1="42.0" x2="218.9" y2="42.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
<circle cx="197.2" cy="42.0" r="5" fill="#64748b" stroke="#64748b" stroke-width="2"/>
<text x="160" y="72" text-anchor="end" class="label">geometry</text>
<line x1="218.9" y1="68.0" x2="289.5" y2="68.0" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
<circle cx="251.5" cy="68.0" r="5" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
<text x="160" y="98" text-anchor="end" class="label">feasibility</text>
<line x1="305.8" y1="94.0" x2="365.6" y2="94.0" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
<circle cx="333.0" cy="94.0" r="5" fill="#0ea5e9" stroke="#0ea5e9" stroke-width="2"/>
<text x="160" y="124" text-anchor="end" class="label">sensing + feasibility</text>
<line x1="450.7" y1="120.0" x2="490.6" y2="120.0" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
<circle cx="472.5" cy="120.0" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>
<text x="333" y="170" text-anchor="middle" class="tick">completion probability (layout-cluster 95% CI)</text>
<text x="12" y="204" class="title">(b) Treatment minus control, completion (layout-bootstrap 95% CI)</text>
<line x1="170.0" y1="210" x2="170.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="170.0" y="416" text-anchor="middle" class="tick">-0.25</text>
<line x1="235.2" y1="210" x2="235.2" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="235.2" y="416" text-anchor="middle" class="tick">0</text>
<line x1="300.4" y1="210" x2="300.4" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="300.4" y="416" text-anchor="middle" class="tick">+0.25</text>
<line x1="365.6" y1="210" x2="365.6" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="365.6" y="416" text-anchor="middle" class="tick">+0.50</text>
<line x1="430.8" y1="210" x2="430.8" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="430.8" y="416" text-anchor="middle" class="tick">+0.75</text>
<line x1="496.0" y1="210" x2="496.0" y2="400" stroke="#e2e8f0" stroke-width="1"/>
<text x="496.0" y="416" text-anchor="middle" class="tick">+1.00</text>
<line x1="235.2" y1="210" x2="235.2" y2="400" stroke="#64748b" stroke-width="1.5"/>
<line x1="282.1" y1="210" x2="282.1" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="160" y="230" text-anchor="end" class="label">vs. geometry</text>
<line x1="381.5" y1="226.0" x2="442.4" y2="226.0" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
<circle cx="412.0" cy="226.0" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>
<text x="496" y="218" text-anchor="end" class="tick" paint-order="stroke" stroke="white" stroke-width="4">60 layouts, Holm p < 0.001</text>
<text x="160" y="256" text-anchor="end" class="small">combined</text>
<circle cx="387.3" cy="252.0" r="4" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="160" y="282" text-anchor="end" class="small">docking observ.</text>
<circle cx="417.8" cy="278.0" r="4" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="160" y="308" text-anchor="end" class="small">reconf. workspace</text>
<circle cx="430.8" cy="304.0" r="4" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="160" y="334" text-anchor="end" class="label">vs. feasibility</text>
<line x1="363.4" y1="330.0" x2="441.7" y2="330.0" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
<circle cx="402.5" cy="330.0" r="5" fill="#16a34a" stroke="#16a34a" stroke-width="2"/>
<text x="496" y="322" text-anchor="end" class="tick" paint-order="stroke" stroke="white" stroke-width="4">40 layouts, Holm p < 0.001</text>
<text x="160" y="360" text-anchor="end" class="small">combined</text>
<circle cx="387.3" cy="356.0" r="4" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="160" y="386" text-anchor="end" class="small">docking observ.</text>
<circle cx="417.8" cy="382.0" r="4" fill="white" stroke="#64748b" stroke-width="2"/>
<text x="333" y="432" text-anchor="middle" class="tick">dashed: smallest effect of interest (0.18); hollow: family mean, untested</text>
</svg>

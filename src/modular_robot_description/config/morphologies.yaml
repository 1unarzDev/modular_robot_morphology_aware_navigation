schema_version: 1
frame_id: core/base_link
inventory:
  core:
    type: sensor_core
    size: [0.26, 0.20, 0.12]
    mass: 5.0
  spine_front:
    type: articulated_spine
    size: [0.20, 0.08, 0.06]
    mass: 1.2
  spine_rear:
    type: articulated_spine
    size: [0.20, 0.08, 0.06]
    mass: 1.2
  pod_0: &drive_pod
    type: steer_drive_pod
    # Includes the wheel collision envelopes (centers +/-0.07 m, 0.035 m wide).
    size: [0.18, 0.175, 0.12]
    # Compound boxes match the body and conservative wheel-cylinder bounds.
    # Centers are relative to the 0.12 m envelope center used by planning.
    collision_boxes:
      - {name: body, center: [0.0, 0.0, 0.01], size: [0.18, 0.10, 0.10]}
      - {name: left_wheel, center: [0.0, 0.07, -0.005], size: [0.11, 0.035, 0.11]}
      - {name: right_wheel, center: [0.0, -0.07, -0.005], size: [0.11, 0.035, 0.11]}
    mass: 2.1
    wheel_radius: 0.055
    max_drive_speed: 1.2
    max_steer_rate: 2.4
    connector_tolerance: {translation: 0.008, yaw: 0.05236}
  pod_1: *drive_pod
  pod_2: *drive_pod
  pod_3: *drive_pod
  pod_4: *drive_pod
  pod_5: *drive_pod

objective:
  lambda_energy_s_per_joule: 0.015
  lambda_risk_seconds: 20.0
  unknown_space_risk: 0.35

morphologies:
  compact_diff:
    experiment_support: simulated
    locomotion_mode: differential
    # Physical envelope plus 0.07-0.08 m operational clearance per side.
    footprint: [[-0.40, -0.36], [0.40, -0.36], [0.40, 0.36], [-0.40, 0.36]]
    navigation_footprint: [[-0.33, -0.28], [0.33, -0.28], [0.33, 0.28], [-0.33, 0.28]]
    height: 0.30
    center_of_mass: [0.0, 0.0, 0.13]
    limits: {linear: 0.9, angular: 1.6, acceleration: 1.2}
    controller_id: FollowPathDiff
    pods:
      pod_0: [0.23, 0.18, 0.0]
      pod_1: [0.23, -0.18, 0.0]
      pod_2: [-0.23, 0.18, 0.0]
      pod_3: [-0.23, -0.18, 0.0]
      pod_4: [0.0, 0.18, 0.0]
      pod_5: [0.0, -0.18, 0.0]

  ackermann:
    experiment_support: future_concept
    locomotion_mode: ackermann
    footprint: [[-0.38, -0.27], [0.38, -0.27], [0.38, 0.27], [-0.38, 0.27]]
    height: 0.30
    center_of_mass: [0.0, 0.0, 0.12]
    limits: {linear: 1.5, angular: 0.9, acceleration: 1.0, min_turning_radius: 0.52}
    controller_id: FollowPathAckermann
    pods:
      pod_0: [0.29, 0.18, 0.0]
      pod_1: [0.29, -0.18, 0.0]
      pod_2: [-0.29, 0.18, 0.0]
      pod_3: [-0.29, -0.18, 0.0]
      pod_4: [0.0, 0.18, 0.0]
      pod_5: [0.0, -0.18, 0.0]

  wide_swerve:
    experiment_support: future_concept
    locomotion_mode: omnidirectional
    footprint: [[-0.40, -0.45], [0.40, -0.45], [0.40, 0.45], [-0.40, 0.45]]
    height: 0.24
    center_of_mass: [0.0, 0.0, 0.10]
    limits: {linear: 1.2, lateral: 1.0, angular: 1.8, acceleration: 1.0}
    controller_id: FollowPathOmni
    pods:
      pod_0: [0.28, 0.34, 0.7854]
      pod_1: [0.28, -0.34, -0.7854]
      pod_2: [-0.28, 0.34, -0.7854]
      pod_3: [-0.28, -0.34, 0.7854]
      pod_4: [0.0, 0.34, 1.5708]
      pod_5: [0.0, -0.34, -1.5708]

  narrow_tandem:
    experiment_support: simulated
    locomotion_mode: differential
    # A long, staggered two-track arrangement. Pods remain on the ground and
    # clear the 0.20 m-wide core; the footprint includes their wheel envelopes.
    # Physical envelope plus 0.07-0.08 m operational clearance per side.
    footprint: [[-0.88, -0.26], [0.88, -0.26], [0.88, 0.26], [-0.88, 0.26]]
    navigation_footprint: [[-0.81, -0.19], [0.81, -0.19], [0.81, 0.19], [-0.81, 0.19]]
    height: 0.30
    center_of_mass: [0.0, 0.0, 0.13]
    limits: {linear: 0.65, angular: 0.75, acceleration: 0.55}
    controller_id: FollowPathNarrow
    pods:
      pod_0: [0.71, 0.10, 0.0]
      pod_1: [0.71, -0.10, 0.0]
      pod_2: [-0.71, 0.10, 0.0]
      pod_3: [-0.71, -0.10, 0.0]
      pod_4: [0.35, 0.10, 0.0]
      pod_5: [-0.35, -0.10, 0.0]

  long_crawler:
    experiment_support: future_concept
    locomotion_mode: skid_steer
    footprint: [[-0.68, -0.23], [0.68, -0.23], [0.68, 0.23], [-0.68, 0.23]]
    height: 0.24
    center_of_mass: [0.0, 0.0, 0.10]
    limits: {linear: 1.3, angular: 0.55, acceleration: 0.8}
    controller_id: FollowPathLong
    pods:
      pod_0: [0.53, 0.18, 0.0]
      pod_1: [0.53, -0.18, 0.0]
      pod_2: [0.0, 0.18, 0.0]
      pod_3: [0.0, -0.18, 0.0]
      pod_4: [-0.53, 0.18, 0.0]
      pod_5: [-0.53, -0.18, 0.0]

  articulated:
    experiment_support: future_concept
    locomotion_mode: articulated
    footprint: [[-0.45, -0.24], [0.45, -0.24], [0.45, 0.24], [-0.45, 0.24]]
    height: 0.27
    center_of_mass: [0.0, 0.0, 0.12]
    limits: {linear: 0.7, angular: 1.45, articulation: 1.1, acceleration: 0.6}
    controller_id: FollowPathArticulated
    pods:
      pod_0: [0.34, 0.19, 0.0]
      pod_1: [0.34, -0.19, 0.0]
      pod_2: [0.0, 0.19, 0.0]
      pod_3: [0.0, -0.19, 0.0]
      pod_4: [-0.34, 0.19, 0.0]
      pod_5: [-0.34, -0.19, 0.0]

transitions:
  - {id: compact_to_ackermann, from: compact_diff, to: ackermann, time: 18.0, energy: 105.0, failure_probability: 0.035, swept_radius: 0.54, moved_pods: [pod_0, pod_1, pod_2, pod_3]}
  - {id: ackermann_to_compact, from: ackermann, to: compact_diff, time: 18.0, energy: 105.0, failure_probability: 0.035, swept_radius: 0.54, moved_pods: [pod_0, pod_1, pod_2, pod_3]}
  - {id: compact_to_wide, from: compact_diff, to: wide_swerve, time: 28.0, energy: 155.0, failure_probability: 0.05, swept_radius: 0.63, moved_pods: [pod_0, pod_1, pod_2, pod_3, pod_4, pod_5]}
  - {id: wide_to_compact, from: wide_swerve, to: compact_diff, time: 28.0, energy: 155.0, failure_probability: 0.05, swept_radius: 0.63, moved_pods: [pod_5, pod_4, pod_3, pod_2, pod_1, pod_0]}
  - id: compact_to_narrow
    from: compact_diff
    to: narrow_tandem
    time: 45.0
    energy: 220.0
    failure_probability: 0.045
    # Conservative staging clearance leaves the assembled long body room to
    # align before its nose enters a doorway.
    swept_radius: 1.0
    moved_pods: [pod_0, pod_2, pod_1, pod_3, pod_4, pod_5]
    pod_waypoints:
      pod_0: [[0.57, 0.10, 0.0]]
      pod_2: [[-0.57, 0.10, 0.0]]
      pod_1: [[0.57, -0.10, 0.0]]
      pod_3: [[-0.57, -0.10, 0.0]]
      pod_4: [[0.21, 0.10, 0.0]]
      pod_5: [[-0.21, -0.10, 0.0]]
  - id: narrow_to_compact
    from: narrow_tandem
    to: compact_diff
    time: 45.0
    energy: 220.0
    failure_probability: 0.045
    swept_radius: 1.0
    moved_pods: [pod_4, pod_5, pod_0, pod_2, pod_1, pod_3]
  - {id: compact_to_long, from: compact_diff, to: long_crawler, time: 31.0, energy: 175.0, failure_probability: 0.06, swept_radius: 0.76, moved_pods: [pod_0, pod_1, pod_2, pod_3, pod_4, pod_5]}
  - {id: long_to_compact, from: long_crawler, to: compact_diff, time: 31.0, energy: 175.0, failure_probability: 0.06, swept_radius: 0.76, moved_pods: [pod_5, pod_4, pod_3, pod_2, pod_1, pod_0]}
  - {id: compact_to_articulated, from: compact_diff, to: articulated, time: 20.0, energy: 118.0, failure_probability: 0.04, swept_radius: 0.56, moved_pods: [pod_0, pod_1, pod_2, pod_3, pod_4, pod_5]}
  - {id: articulated_to_compact, from: articulated, to: compact_diff, time: 20.0, energy: 118.0, failure_probability: 0.04, swept_radius: 0.56, moved_pods: [pod_5, pod_4, pod_3, pod_2, pod_1, pod_0]}

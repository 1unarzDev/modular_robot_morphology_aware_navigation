map_server:
  ros__parameters:
    use_sim_time: true
    topic_name: map
    frame_id: map

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: core/base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.08
    laser_max_range: 14.5
    max_beams: 90
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.12
    alpha4: 0.12
    alpha5: 0.1
    sigma_hit: 0.2
    z_hit: 0.55
    z_rand: 0.45
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    transform_tolerance: 0.3
    tf_broadcast: true
    set_initial_pose: true

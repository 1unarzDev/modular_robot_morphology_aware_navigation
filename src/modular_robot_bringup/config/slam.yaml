slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: core/base_link
    scan_topic: /scan
    resolution: 0.05
    max_laser_range: 14.5
    minimum_time_interval: 0.1
    transform_publish_period: 0.02
    map_update_interval: 1.0

